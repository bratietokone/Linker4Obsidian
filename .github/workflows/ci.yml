name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Dependency audit (advisory only)
        shell: bash
        run: |
          npm audit --json > npm-audit-report.json || true
          node -e 'const a=require("./npm-audit-report.json");console.log("Dependency audit:", JSON.stringify(a.metadata?.vulnerabilities ?? a.error ?? {}));for(const [name,v] of Object.entries(a.vulnerabilities??{})) console.log("Audit package:", JSON.stringify({name,severity:v.severity,isDirect:v.isDirect,fixAvailable:v.fixAvailable,via:v.via?.map(x=>typeof x==="string"?x:x.name)}))'
      - uses: actions/upload-artifact@v4
        with:
          name: linker-dependency-audit
          path: npm-audit-report.json
          if-no-files-found: error
      - run: npm run validate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - name: Verify deterministic build output
        shell: bash
        run: |
          set -euo pipefail
          cp main.js /tmp/linker-first-build.js
          npm run build
          cmp -s main.js /tmp/linker-first-build.js
          sha256sum main.js
      - name: Package test build
        run: |
          mkdir -p dist/linker
          cp main.js manifest.json dist/linker/
      - uses: actions/upload-artifact@v4
        with:
          name: linker-test-build
          path: dist/
          if-no-files-found: error
