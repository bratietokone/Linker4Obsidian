name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run validate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - name: Verify committed build matches source
        run: git diff --exit-code -- main.js
      - name: Package test build
        run: |
          mkdir -p dist/linker
          cp main.js manifest.json dist/linker/
      - uses: actions/upload-artifact@v4
        with:
          name: linker-test-build
          path: dist/
          if-no-files-found: error
