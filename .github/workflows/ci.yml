name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: Package test build
        run: |
          mkdir -p dist/linker4obsidian
          cp main.js manifest.json dist/linker4obsidian/
      - uses: actions/upload-artifact@v4
        with:
          name: linker4obsidian-test-build
          path: dist/
          if-no-files-found: error
