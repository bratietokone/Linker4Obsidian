name: Publish release

on:
  push:
    branches: [main]
    paths:
      - manifest.json
      - CHANGELOG.md
      - CHANGELOG.ru.md
      - CHANGELOG.es.md
      - CHANGELOG.zh-CN.md
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify TypeScript
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
      - name: Prepare release assets and notes
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./manifest.json').version")"
          test "$(node -p "require('./package.json').version")" = "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          awk -v header="## [$VERSION]" '
            /^## \[/ { if (found) exit; if (index($0, header) == 1) { found=1; next } }
            found { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md
          mkdir -p dist/linker4obsidian
          cp main.js manifest.json dist/linker4obsidian/
          (cd dist && zip -q -r "linker4obsidian-v${VERSION}.zip" linker4obsidian)
      - name: Keep built main.js in the repository
        id: sync
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet -- main.js; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add main.js
            git commit -m "build: refresh main.js for v${{ steps.prepare.outputs.version }} [skip ci]"
            git push origin HEAD:main
          fi
          echo "target=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v${{ steps.prepare.outputs.version }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving it unchanged."
            exit 0
          fi
          gh release create "$TAG" \
            main.js manifest.json \
            "dist/linker4obsidian-v${{ steps.prepare.outputs.version }}.zip" \
            --target "${{ steps.sync.outputs.target }}" \
            --title "Linker4Obsidian $TAG" \
            --notes-file release-notes.md