name: Publish Linker release

# A new manifest version on main is the release signal.
# Manual dispatch can retry a failed publication without a local Git checkout.
on:
  push:
    branches: [main]
    paths:
      - manifest.json
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

# Never publish two releases concurrently.
concurrency:
  group: linker-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Validate release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./manifest.json').version")"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$VERSION" = "$PACKAGE_VERSION"
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate manifest
        run: npm run validate
      - name: Typecheck
        run: npm run typecheck
      - name: Review Obsidian source code
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
      - name: Verify deterministic build output
        shell: bash
        run: |
          set -euo pipefail
          cp main.js /tmp/linker-first-build.js
          npm run build
          cmp -s main.js /tmp/linker-first-build.js
          sha256sum main.js
      - name: Prepare release files and notes
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          awk -v header="## [$VERSION]" '
            /^## \[/ { if (found) exit; if (index($0, header) == 1) { found=1; next } }
            found { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md || {
            echo "::error::CHANGELOG.md has no release notes for $VERSION"
            exit 1
          }
      - name: Attest release files
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json
      - name: Publish verified release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          # Ignore an already published version. This makes manual reruns safe.
          DRAFT=""
          if DRAFT="$(gh release view "$VERSION" --json isDraft --jq '.isDraft' 2>/dev/null)"; then
            if [[ "$DRAFT" == "false" ]]; then
              echo "Release $VERSION is already published; leaving it unchanged."
              exit 0
            fi
            if [[ "$DRAFT" != "true" ]]; then
              echo "::error::Cannot determine existing release status for $VERSION"
              exit 1
            fi
          fi

          # A tag may already exist after a failed attempt. Never move it.
          TAG_SHA="$(git ls-remote --refs origin "refs/tags/${VERSION}" | awk '{print $1}')"
          if [[ -n "$TAG_SHA" && "$TAG_SHA" != "$GITHUB_SHA" ]]; then
            echo "::error::Tag $VERSION points to $TAG_SHA, not $GITHUB_SHA; refusing to publish."
            exit 1
          fi

          if [[ "$DRAFT" == "true" ]]; then
            echo "Resuming draft release $VERSION."
            gh release upload "$VERSION" main.js manifest.json --clobber
          else
            # Upload as draft first; publish only once all files are present.
            gh release create "$VERSION" \
              main.js manifest.json \
              --target "$GITHUB_SHA" \
              --title "Linker $VERSION" \
              --notes-file release-notes.md \
              --draft
          fi

          ASSETS="$(gh release view "$VERSION" --json assets --jq '.assets[].name')"
          for REQUIRED in main.js manifest.json; do
            if ! grep -Fxq "$REQUIRED" <<< "$ASSETS"; then
              echo "::error::Missing release asset: $REQUIRED"
              exit 1
            fi
          done

          gh release edit "$VERSION" \
            --title "Linker $VERSION" \
            --notes-file release-notes.md \
            --draft=false \
            --latest
          echo "Published Linker $VERSION."
