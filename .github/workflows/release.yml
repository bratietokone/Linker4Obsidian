name: Prepare plugin release

on:
  push:
    tags:
      - '*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate tag and manifest
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./manifest.json').version")"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          test "$VERSION" = "$PACKAGE_VERSION"
          test "$VERSION" = "$GITHUB_REF_NAME"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate plugin manifest
        run: npm run validate
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
      - name: Verify committed build matches source
        run: git diff --exit-code -- main.js
      - name: Prepare assets and release notes
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$GITHUB_REF_NAME"
          awk -v header="## [$VERSION]" '
            /^## \[/ { if (found) exit; if (index($0, header) == 1) { found=1; next } }
            found { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md
          mkdir -p dist/linker
          cp main.js manifest.json dist/linker/
          (cd dist && zip -q -r "linker-v${VERSION}.zip" linker)
      - name: Create draft GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; no overwrite."
            exit 0
          fi
          gh release create "$TAG" \
            main.js manifest.json "dist/linker-v${TAG}.zip" \
            --target "$GITHUB_SHA" \
            --title "Linker $TAG" \
            --notes-file release-notes.md \
            --draft
