name: Generate npm lockfile (temporary)

on:
  push:
    branches:
      - chore/reproducible-npm-lockfile
    paths:
      - .github/workflows/generate-lockfile.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve and lock dependencies
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Validate generated lockfile
        run: |
          node - <<'NODE'
          const assert = require('node:assert/strict');
          const pkg = require('./package.json');
          const lock = require('./package-lock.json');
          assert.equal(lock.lockfileVersion, 3);
          assert.equal(lock.name, pkg.name);
          assert.equal(lock.version, pkg.version);
          assert.deepEqual(lock.packages[''].devDependencies, pkg.devDependencies);
          NODE
      - name: Commit lockfile back to preparation branch
        run: |
          set -euo pipefail
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "No changes to package-lock.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: commit reproducible npm dependency lockfile"
          git push origin HEAD:chore/reproducible-npm-lockfile
