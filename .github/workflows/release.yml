name: Prepare plugin release

on:
  push:
    tags:
      - '*.*.*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate tag and manifest
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./manifest.json').version")"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          test "$VERSION" = "$PACKAGE_VERSION"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            test "$GITHUB_REF" = "refs/heads/main"
          else
            test "$VERSION" = "$GITHUB_REF_NAME"
          fi
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate plugin manifest
        run: npm run validate
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
      - name: Verify committed build matches source
        run: git diff --exit-code -- main.js
      - name: Prepare assets and release notes
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./manifest.json').version")"
          awk -v header="## [$VERSION]" '
            /^## \[/ { if (found) exit; if (index($0, header) == 1) { found=1; next } }
            found { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md
          mkdir -p dist/linker
          cp main.js manifest.json dist/linker/
          (cd dist && zip -q -r "linker-v${VERSION}.zip" linker)
      - name: Create draft GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="$(node -p "require('./manifest.json').version")"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            # The workflow runs only on main. Create a lightweight tag after
            # validation, typechecking, build, and tests have passed.
            EXISTING_SHA="$(git ls-remote --refs origin "refs/tags/${TAG}" | awk '{print $1}')"
            if [[ -n "$EXISTING_SHA" && "$EXISTING_SHA" != "$GITHUB_SHA" ]]; then
              echo "::error::Tag $TAG points to $EXISTING_SHA, not $GITHUB_SHA"
              exit 1
            fi
            if [[ -z "$EXISTING_SHA" ]]; then
              gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" \
                -f "ref=refs/tags/${TAG}" \
                -f "sha=${GITHUB_SHA}" >/dev/null
            fi
          fi
          if gh release list --limit 100 --json tagName | jq -e --arg tag "$TAG" 'any(.[]; .tagName == $tag)' >/dev/null; then
            echo "Release $TAG already exists; no overwrite."
            exit 0
          fi
          gh release create "$TAG" \
            main.js manifest.json "dist/linker-v${TAG}.zip" \
            --target "$GITHUB_SHA" \
            --title "Linker $TAG" \
            --notes-file release-notes.md \
            --draft
